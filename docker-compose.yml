name: jumpernat

networks:
  red_jumper:
    name: red_jumper

# Limites de recursos (regla 6): cada contenedor no puede comerse el servidor
x-limites: &limites
  mem_limit: 96m
  cpus: "0.25"

x-nodo: &nodo
  build: ./servicios/nodo
  image: jumpernat/nodo
  restart: unless-stopped
  environment:
    NODO_PORT: "9000"
    API_URL: http://api:8000
    INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    INTERVALO_HB_SEG: "10"
  networks: [red_jumper]
  <<: *limites

services:
  # Fase 5: proxy SOCKS5 de entrada (publica 1080). Solo este y caddy se
  # publican en el host (regla 2); todo lo demas queda en la red interna red_jumper.
  entrada:
    build: ./servicios/entrada
    image: jumpernat/entrada
    restart: unless-stopped
    ports:
      - "1080:1080"
    environment:
      PUERTO_ENTRADA: "1080"
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PUERTOS_PERMITIDOS: "80,443"
      EXCEPCIONES_PRIVADAS: web-destino
    depends_on:
      - api
    networks: [red_jumper]
    <<: *limites

  # HTTPS + Let's Encrypt automatico para ${DOMINIO} (Fase 4). Si la Security
  # List de Oracle tiene los puertos 80/443 abiertos, la emision es instantanea.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - api
    networks: [red_jumper]
    <<: *limites

  api:
    build: ./servicios/api
    image: jumpernat/api
    # argon2 necesita RAM para calcular hashes: el limite de 256m evita el OOM del cgroup
    mem_limit: 256m
    restart: unless-stopped
    environment:
      DB_PATH: /data/jumpernat.db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      UMBRAL_CAIDO_SEG: "35"
    volumes:
      - ./data:/data
    # Regla 2: la API NO se publica en el host. Binding a 127.0.0.1 para
    # poder depurar desde el propio servidor; solo Caddy la expone (Fase 4).
    ports:
      - "127.0.0.1:8000:8000"
    networks: [red_jumper]
    <<: *limites

  # Cada nodo se registra en la API con su NODO_NOMBRE; compose no permite
  # templates en el environment, asi que se declara por nodo
  nodo1:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo1
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"
  nodo2:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo2
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"
  nodo3:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo3
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"
  nodo4:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo4
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"
  nodo5:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo5
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"
  nodo6:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo6
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      INTERVALO_HB_SEG: "10"

  web-destino:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./config/web-destino:/etc/nginx/conf.d:ro
    networks:
      red_jumper:
        aliases: [web-destino]
    <<: *limites

  cliente-test:
    image: python:3.12-slim
    restart: "no"
    profiles: ["test"]  # solo se ejecuta cuando lo llamamos: docker compose run cliente-test
    volumes:
      - ./tests:/tests:ro
    working_dir: /tests
    entrypoint: ["python"]
    networks: [red_jumper]
