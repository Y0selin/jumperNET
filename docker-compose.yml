name: jumpernat

networks:
  red_jumper:
    name: red_jumper

# Limites de recursos (regla 6): cada contenedor no puede comerse el servidor
x-limites: &limites
  mem_limit: 96m
  cpus: "0.25"

x-nodo: &nodo
  build:
    context: ./servicios
    dockerfile: nodo/Dockerfile
  image: jumpernat/nodo
  restart: unless-stopped
  environment:
    NODO_PORT: "9000"
    API_URL: http://api:8000
    INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    # Fase 8: si esta definida, la entrada cifra el stream y el exit lo descifra
    CLAVE_SALTOS: ${CLAVE_SALTOS:-}
    INTERVALO_HB_SEG: "10"
  networks: [red_jumper]
  <<: *limites

services:
  # Fase 5: proxy SOCKS5 de entrada (publica 1080). Solo este y caddy se
  # publican en el host (regla 2); todo lo demas queda en la red interna red_jumper.
  entrada:
    build:
      context: ./servicios
      dockerfile: entrada/Dockerfile
    image: jumpernat/entrada
    restart: unless-stopped
    ports:
      - "1080:1080"
    environment:
      PUERTO_ENTRADA: "1080"
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PUERTOS_PERMITIDOS: "80,443"
      EXCEPCIONES_PRIVADAS: web-destino
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
    depends_on:
      - api
    networks: [red_jumper]
    <<: *limites

  # Entrada HTTP (publica 1081): proxy HTTP CONNECT con autenticacion Basic
  # para la extension del navegador (Chrome no admite SOCKS5 con credenciales;
  # la extension SI puede responder al 407 con webRequest.onAuthRequired).
  # Mismas reglas: credenciales de la cuenta, 80/443, anti-IP-privadas, JENC.
  entrada-http:
    build:
      context: ./servicios
      dockerfile: entrada-http/Dockerfile
    image: jumpernat/entrada-http
    restart: unless-stopped
    ports:
      - "1081:1081"
    environment:
      PUERTO_ENTRADA_HTTP: "1081"
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PUERTOS_PERMITIDOS: "80,443"
      EXCEPCIONES_PRIVADAS: web-destino
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
    depends_on:
      - api
    networks: [red_jumper]
    <<: *limites

  # HTTPS + Let's Encrypt automatico para ${DOMINIO} (Fase 4). Si la Security
  # List de Oracle tiene los puertos 80/443 abiertos, la emision es instantanea.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./descargas:/srv/bajares:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - api
    networks: [red_jumper]
    <<: *limites

  api:
    build: ./servicios/api
    image: jumpernat/api
    # argon2 necesita RAM para calcular hashes: el limite de 256m evita el OOM del cgroup
    mem_limit: 256m
    restart: unless-stopped
    environment:
      DB_PATH: /data/jumpernat.db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Fase 9: token de los nodos PERSONALES de usuarios (peers), separado del
      # interno para que un amigo no necesita conocer los secretos de sistemas
      PEER_TOKEN: ${PEER_TOKEN:-}
      UMBRAL_CAIDO_SEG: "35"
    volumes:
      - ./data:/data
    # Regla 2: la API NO se publica en el host. Binding a 127.0.0.1 para
    # poder depurar desde el propio servidor; solo Caddy la expone (Fase 4).
    ports:
      - "127.0.0.1:8000:8000"
    networks: [red_jumper]
    <<: *limites

  # Cada nodo se registra en la API con su NODO_NOMBRE; compose no permite
  # templates en el environment, asi que se declara por nodo
  nodo1:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo1
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"
  nodo2:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo2
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"
  nodo3:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo3
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"
  nodo4:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo4
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"
  nodo5:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo5
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"
  nodo6:
    <<: *nodo
    environment:
      NODO_PORT: "9000"
      NODO_NOMBRE: nodo6
      API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CLAVE_SALTOS: ${CLAVE_SALTOS:-}
      INTERVALO_HB_SEG: "10"

  web-destino:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./config/web-destino:/etc/nginx/conf.d:ro
    networks:
      red_jumper:
        aliases: [web-destino]
    <<: *limites

  cliente-test:
    image: python:3.12-slim
    restart: "no"
    profiles: ["test"]  # solo se ejecuta cuando lo llamamos: docker compose run cliente-test
    volumes:
      - ./tests:/tests:ro
      - ./servicios/_comun:/app/_comun:ro
    environment:
      PYTHONPATH: /app
    working_dir: /tests
    entrypoint: ["python"]
    networks: [red_jumper]

  # ─── Documentación (WordPress): caddy la sirve en https://DOMINIO/docs/ ───
  wp_db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${WP_DB_PASS}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT}
    command: --max_allowed_packet=16M --innodb_buffer_pool_size=48M
    volumes:
      - ./data/wp_db:/var/lib/mysql
    networks: [red_jumper]
    mem_limit: 192m

  wp:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASS}
      WORDPRESS_CONFIG_EXTRA: |
        define("WP_HOME", "https://jumpernet.duckdns.org/docs");
        define("WP_SITEURL", "https://jumpernet.duckdns.org/docs");
        define("DISALLOW_FILE_EDIT", true);
    volumes:
      - ./data/wp:/var/www/html
    depends_on: [wp_db]
    networks: [red_jumper]
    mem_limit: 224m
