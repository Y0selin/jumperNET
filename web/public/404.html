<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JumperNET</title>
  <script>
    /* GitHub Pages no reescribe rutas: /jumperNET/admin responde esta 404.
       Se reenvía a la portada con la ruta en el hash, que es la que usa la app
       (#/panel/admin). La carpeta del sitio sale del propio camino de esta
       página, así que funciona en cualquier subcarpeta. */
    (function () {
      /* En un site de proyecto la primera carpeta es el repositorio
         (/jumperNET/); el resto es la ruta que se pidió. */
      var trozos = location.pathname.split("/").filter(Boolean);
      var raiz = trozos.length ? "/" + trozos[0] + "/" : "/";
      var ruta = trozos.slice(1).join("/");
      location.replace(raiz + "#/" + ruta);
    })();
  </script>
</head>
<body></body>
</html>
