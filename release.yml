name: Publicar release (segunda via de descarga)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos oficiales del servidor
        run: |
          base="https://jumpernet.duckdns.org/bajares"
          curl -fL --retry 3 -o JumperNET-1.0.0.AppImage "$base/JumperNET-1.0.0.AppImage"
          curl -fL --retry 3 -o jumpernet-navegador-windows-1.0.0.zip "$base/jumpernet-navegador-windows.zip"
          curl -fL --retry 3 -o LEEME-navegador.txt "$base/LEEME-navegador.txt"
          curl -fL --retry 3 -o notas.md "https://jumpernet.duckdns.org/bajares/notas-release.md"
          ls -la

      - name: Crear release (si no existe)
        run: |
          set -o pipefail
          {
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "la release $GITHUB_REF_NAME ya existe — solo subo activos"
            else
              gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --title "JumperNET $GITHUB_REF_NAME — navegador con circuito de 3 saltos" \
                --notes-file notas.md
            fi
          } 2>&1 | tee -a gh.log

      - name: Subir activos (3 archivos)
        run: |
          set -o pipefail
          gh release upload "$GITHUB_REF_NAME" \
            JumperNET-1.0.0.AppImage \
            jumpernet-navegador-windows-1.0.0.zip \
            LEEME-navegador.txt \
            --clobber 2>&1 | tee -a gh.log

      - name: Mostrar release resultante
        run: gh release view "$GITHUB_REF_NAME" --json assets,url 2>&1 | tee -a gh.log

      - name: Guardar diagnostico con la salida de gh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-release
          path: gh.log
          if-no-files-found: ignore
