name: Publicar release (segunda via de descarga)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos oficiales del servidor (builds v2)
        run: |
          base="https://jumpernet.duckdns.org/bajares"
          curl -fL --retry 3 -o JumperNET-1.0.0.AppImage "$base/JumperNET-1.0.0.AppImage"
          curl -fL --retry 3 -o jumpernet-navegador-windows-2.0.0.zip "$base/jumpernet-navegador-windows.zip"
          curl -fL --retry 3 -o jumpernet-navegador-portable.exe "$base/jumpernet-navegador-portable.exe"
          curl -fL --retry 3 -o "JumperNET-Browser-Setup-1.0.0.exe" "$base/JumperNET%20Browser%20Setup%201.0.0.exe"
          curl -fL --retry 3 -o LEEME-navegador.txt "$base/LEEME-navegador.txt"
          curl -fL --retry 3 -o notas.md "$base/notas-release.md"
          ls -la

      - name: Crear release (si no existe)
        run: |
          set -o pipefail
          {
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "la release $GITHUB_REF_NAME ya existe — solo subo activos"
            else
              gh release create "$GITHUB_REF_NAME" \
                --verify-tag \
                --title "JumperNET Browser v2 — navegador con circuito de 3 saltos" \
                --notes-file notas.md
            fi
          } 2>&1 | tee -a gh.log

      - name: Subir activos (5 archivos)
        run: |
          set -o pipefail
          gh release upload "$GITHUB_REF_NAME" \
            JumperNET-1.0.0.AppImage \
            jumpernet-navegador-windows-2.0.0.zip \
            jumpernet-navegador-portable.exe \
            "JumperNET-Browser-Setup-1.0.0.exe" \
            LEEME-navegador.txt \
            --clobber 2>&1 | tee -a gh.log

      - name: Mostrar release resultante
        run: gh release view "$GITHUB_REF_NAME" --json assets,url 2>&1 | tee -a gh.log

      - name: Publicar diagnostico en la rama diag-release (legible sin auth)
        if: always()
        run: |
          set -e
          if [ -f gh.log ]; then
            git config user.email "bot@jumpernet"
            git config user.name "bot-dialogo"
            git checkout -q -B diag-release
            cp gh.log diagnostico-release.txt
            git add -f diagnostico-release.txt
            git commit -qm "diagnostico de la publicacion del release"
            git push -q -f origin diag-release
          fi
