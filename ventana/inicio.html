<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>JumperNET · Inicio</title>
  <style>
    :root{--ac:#6c5ce7;--ac2:#8f7bff;--cy:#38bdf8;--bor:#262631;--txt:#e8e8ea;--suave:#9a9aa2}
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{
      font-family:system-ui,"Segoe UI",sans-serif;color:var(--txt);
      background:
        radial-gradient(900px 420px at 62% -10%, rgb(108 92 231/.22), transparent 62%),
        radial-gradient(700px 320px at 8% 85%, rgb(56 189 248/.08), transparent 55%),
        linear-gradient(rgb(255 255 255/.02) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255/.02) 1px, transparent 1px),
        #0b0b10;
      background-size:auto,auto,44px 44px,44px 44px,auto;
      display:grid;place-items:center;
    }
    ::selection{background:rgb(108 92 231/.45)}
    .caja{width:min(620px,92vw);text-align:center;padding:20px}
    .logo{display:flex;align-items:center;justify-content:center;gap:10px}
    .logo .cubo{
      width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;
      font-weight:800;font-size:16px;background:linear-gradient(135deg,var(--ac),#4a3fd8);
      box-shadow:0 8px 24px rgb(108 92 231/.35)
    }
    .logo h1{
      font-size:24px;letter-spacing:-.02em;font-weight:800;
      background:linear-gradient(90deg,var(--ac2),var(--cy));
      -webkit-background-clip:text;background-clip:text;color:transparent
    }
    .sub{margin-top:6px;font-size:12.5px;color:var(--suave)}
    form{margin-top:26px}
    input{
      width:100%;padding:15px 22px;font-size:15px;background:rgba(255,255,255,.05);
      color:var(--txt);border:1px solid var(--bor);border-radius:999px;outline:none;
      transition:border-color .2s,box-shadow .2s
    }
    input::placeholder{color:#6e6e78}
    input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgb(108 92 231/.25)}
    .chips{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
    .chips a{
      padding:8px 15px;border:1px solid var(--bor);border-radius:999px;
      color:#cfc7ff;text-decoration:none;font-size:12.5px;background:rgba(255,255,255,.03);
      transition:border-color .2s,background .2s
    }
    .chips a:hover{border-color:var(--ac);background:rgba(108 92 231/.12)}
    .estsaltos{
      display:inline-flex;align-items:center;gap:8px;margin-top:26px;
      padding:7px 13px;border-radius:999px;border:1px solid rgb(52 212 124/.4);
      background:rgba(52 212 124/.1);color:#8ce8b6;font-size:12px;font-weight:600
    }
    .estsaltos i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
    .nota{margin-top:14px;font-size:11.5px;color:var(--suave);line-height:1.5}
    .nota b{color:#cfc7ff}
  </style>
</head>
<body>
  <div class="caja">
    <div class="logo">
      <span class="cubo">≋</span>
      <h1>JumperNET</h1>
    </div>
    <div class="sub">el navegador que ya viene conectado a tu red</div>

    <form action="https://duckduckgo.com/" method="get">
      <input name="q" placeholder="Buscar en DuckDuckGo — por tu circuito de 3 saltos" autocomplete="off" autofocus />
    </form>

    <div class="chips">
      <a href="https://duckduckgo.com/">DuckDuckGo</a>
      <a href="https://y0selin.github.io/jumperNET/">Panel</a>
      <a href="https://jumpernet.duckdns.org/docs/">Documentación</a>
      <a href="https://jumpernet.duckdns.org/bajares/LEEME-navegador.txt">Instrucciones</a>
    </div>

    <span class="estsaltos"><i></i>CIRCUITO ACTIVO — 3 saltos</span>
    <p class="nota">
      Tu tráfico sale con la <b>IP del nodo de salida</b>, no con la tuya.<br/>
      Nueva pestaña <b>＋</b> abre esta misma página · <b>⌖</b> rota el circuito (estilo Tor).
    </p>
  </div>
</body>
</html>
